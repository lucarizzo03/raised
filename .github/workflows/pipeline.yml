name: pipeline verification

on:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - ".github/workflows/pipeline.yml"
      - ".github/workflows/daily.yml"
  pull_request:
    paths:
      - "pipeline/**"
      - ".github/workflows/pipeline.yml"
      - ".github/workflows/daily.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raised_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/raised_test
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install deps (hash-pinned)
        run: |
          pip install --require-hashes -r requirements.txt
          pip install ruff==0.15.11

      - name: Lint
        run: ruff check .

      - name: Load schema with Supabase-like roles
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "create role anon nologin" -c "create role authenticated nologin" \
            -c "alter default privileges in schema public grant all on tables to anon, authenticated" \
            -f schema.sql
          python -m src.main migrate

      - name: Unit and database tests
        env:
          RUN_DATABASE_TESTS: "1"
        run: python -m unittest discover -s tests -v

      - name: Anon role cannot write
        run: |
          for stmt in \
            "insert into rejected_companies(name, reason, confidence, run_date) values ('x','y',1,current_date)" \
            "select * from rejected_companies" \
            "insert into companies(name, dedupe_key) values ('x','x')" \
            "delete from signals" \
            "select * from pipeline_settings" \
            "select * from processed_articles" \
            "update pipeline_status set last_run_completed_at = now()"; do
            if psql "$DATABASE_URL" -c "set role anon; $stmt" 2>/dev/null; then
              echo "anon was allowed: $stmt"; exit 1
            fi
          done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "set role anon; select count(*) from ranked_companies" -c "set role anon; select * from pipeline_status"
